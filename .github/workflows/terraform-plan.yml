name: Project 12 - Terraform Plan CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'capstone/project12-terraform-ci-plan/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:

jobs:
  terraform-plan:
    name: Validate & Generate Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone/project12-terraform-ci-plan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: mock_access_key
          AWS_SECRET_ACCESS_KEY: mock_secret_key
          AWS_DEFAULT_REGION: ap-south-1
        run: terraform plan -refresh=false -out=tfplan || terraform validate

      - name: Upload Plan Artifact
        if: hashFiles('capstone/project12-terraform-ci-plan/tfplan') != ''
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-artifact
          path: capstone/project12-terraform-ci-plan/tfplan
          retention-days: 7
