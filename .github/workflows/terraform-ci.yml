name: Terraform CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform-checks:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive capstone/ || true

      - name: Terraform Validate All Projects
        run: |
          for tf_dir in $(find capstone -name "*.tf" -exec dirname {} \; | sort -u); do
            echo "Validating $tf_dir..."
            cd "$tf_dir"
            terraform init -backend=false
            terraform validate
            cd - > /dev/null
          done
