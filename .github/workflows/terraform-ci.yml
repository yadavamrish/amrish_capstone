name: Terraform CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform-checks:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive capstone/

      - name: Terraform Validate All Projects
        run: |
          for dir in capstone/project1* capstone/project2* capstone/project3* capstone/project4*; do
            if [ -d "$dir" ]; then
              echo "Validating $dir..."
              cd "$dir"
              terraform init -backend=false
              terraform validate
              cd - > /dev/null
            fi
          done
