apiVersion: apps/v1
kind: Deployment
metadata:
  name: amrish-capstone-web
  labels:
    app: capstone-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-web
  template:
    metadata:
      labels:
        app: capstone-web
    spec:
      containers:
      - name: capstone-container
        image: amrish071/amrish-capstone-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: amrish-capstone-service
spec:
  type: LoadBalancer
  selector:
    app: capstone-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
