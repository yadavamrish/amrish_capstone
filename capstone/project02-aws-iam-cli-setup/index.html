<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amrish Yadav | AWS S3 & Terraform Project</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #f8fafc;
      padding: 20px;
    }
    .container {
      max-width: 680px;
      width: 100%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      padding: 44px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.35);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 17px;
      color: #cbd5e1;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    .box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      padding: 16px 12px;
    }
    .box span {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .box strong {
      font-size: 15px;
      color: #f1f5f9;
    }
    .footer {
      font-size: 13px;
      color: #94a3b8;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      padding-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">● LIVE ON AMAZON S3</div>
    <h1>Amrish Yadav</h1>
    <p class="subtitle">Project 2: Static Website Hosting on AWS S3 Provisioned via Terraform Infrastructure as Code</p>

    <div class="grid">
      <div class="box">
        <span>Cloud Provider</span>
        <strong>Amazon Web Services</strong>
      </div>
      <div class="box">
        <span>Service</span>
        <strong>Amazon S3 Hosting</strong>
      </div>
      <div class="box">
        <span>IaC Tool</span>
        <strong>Terraform</strong>
      </div>
    </div>

    <div class="footer">
      Deployed &amp; Managed by Amrish Yadav &bull; Automated Cloud Infrastructure
    </div>
  </div>
</body>
</html>
