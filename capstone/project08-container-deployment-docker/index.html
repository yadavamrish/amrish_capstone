<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amrish Yadav | Docker Container App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #0ea5e922;
      color: #38bdf8;
      border: 1px solid #38bdf855;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: left;
      background: #0f172a;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      font-size: 14px;
    }
    .label { color: #64748b; display: block; font-size: 12px; }
    .val { color: #e2e8f0; font-weight: 600; margin-top: 2px; }
    .status { color: #22c55e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Project 8 &bull; Container Deployment</div>
    <h1>Docker App Running Locally</h1>
    <p>Containerized static web application served via Nginx Alpine inside a local Docker container.</p>
    <div class="info-grid">
      <div>
        <span class="label">Developer</span>
        <span class="val">Amrish Yadav</span>
      </div>
      <div>
        <span class="label">Container Status</span>
        <span class="val status">&#9679; Running (Healthy)</span>
      </div>
      <div>
        <span class="label">Base Image</span>
        <span class="val">nginx:alpine</span>
      </div>
      <div>
        <span class="label">Exposed Port</span>
        <span class="val">8080 &rarr; 80/tcp</span>
      </div>
    </div>
  </div>
</body>
</html>
